# This file is an example config file for cartesian style printers.
# One may copy and edit this file to configure a new cartesian
# printer.

# DO NOT COPY THIS FILE WITHOUT CAREFULLY READING AND UPDATING IT
# FIRST. Incorrectly configured parameters may cause damage.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[tmc2130 stepper_x]
cs_pin: PE12
spi_software_sclk_pin: PA9
spi_software_mosi_pin: PC3
spi_software_miso_pin: PC2
run_current: 0.5
#hold_current: 0.3
sense_resistor: 0.120
stealthchop_threshold: 999999

[stepper_x]
step_pin: PE13
dir_pin: PE14
enable_pin: !PE11
microsteps: 16
rotation_distance: 32
endstop_pin: ^!PA15
position_endstop: 0
position_max: 215
homing_speed: 50

[tmc2130 stepper_y]
cs_pin: PE8
spi_software_sclk_pin: PA9
spi_software_mosi_pin: PC3
spi_software_miso_pin: PC2
run_current: 0.8
#hold_current: 0.3
sense_resistor: 0.120
stealthchop_threshold: 999999

[stepper_y]
step_pin: PE9
dir_pin: PE10
enable_pin: !PE7
microsteps: 16
rotation_distance: 32
endstop_pin: ^!PA10
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2130 stepper_z]
cs_pin: PC5
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.5
hold_current: 0.2
sense_resistor: 0.120
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PB2
enable_pin: !PC4
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PA8
position_endstop: 0
#position_min: -0.5
position_max: 200

[tmc2130 stepper_z1]
cs_pin: PA2
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.5
hold_current: 0.2
sense_resistor: 0.120
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PA3
dir_pin: !PA4
enable_pin: !PA1
microsteps: 16
rotation_distance: 8
#endstop_pin: ^!PA8

[tmc2130 extruder]
cs_pin: PC14
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.8
#hold_current: 0.25
sense_resistor: 0.120
stealthchop_threshold: 999999

[extruder]
step_pin: PC15
dir_pin: PA0
enable_pin: !PC13
microsteps: 128
rotation_distance: 33.684
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC6
#max_power: 0.5
sensor_type: Generic 3950
pullup_resistor: 4700
sensor_pin: PC0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PD15
#max_power: 0.5
#pwm_cycle_time: 0.100
sensor_type: Generic 3950
pullup_resistor: 4700
sensor_pin: PC1
control: watermark
min_temp: 0
max_temp: 300

[fan]
pin: PD8

[heater_fan heatbreak_cooling_fan]
pin: PB11

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_1B0046001951333337383632-if00
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 1500
max_z_velocity: 15
max_z_accel: 30

[gcode_arcs]
resolution: 0.25



## TMC2130 config
#[tmc2130 stepper_x]
#cs_pin:
#   The pin corresponding to the TMC2130 chip select line. This pin
#   will be set to low at the start of SPI messages and raised to high
#   after the message completes. This parameter must be provided.
#spi_speed:
#spi_bus:
#spi_software_sclk_pin:
#spi_software_mosi_pin:
#spi_software_miso_pin:
#   See the "common SPI settings" section for a description of the
#   above parameters.
#chain_position:
#chain_length:
#   These parameters configure an SPI daisy chain. The two parameters
#   define the stepper position in the chain and the total chain length.
#   Position 1 corresponds to the stepper that connects to the MOSI signal.
#   The default is to not use an SPI daisy chain.
#interpolate: True
#   If true, enable step interpolation (the driver will internally
#   step at a rate of 256 micro-steps). This interpolation does
#   introduce a small systemic positional deviation - see
#   TMC_Drivers.md for details. The default is True.
#run_current:
#   The amount of current (in amps RMS) to configure the driver to use
#   during stepper movement. This parameter must be provided.
#hold_current:
#   The amount of current (in amps RMS) to configure the driver to use
#   when the stepper is not moving. Setting a hold_current is not
#   recommended (see TMC_Drivers.md for details). The default is to
#   not reduce the current.
#sense_resistor: 0.110
#   The resistance (in ohms) of the motor sense resistor. The default
#   is 0.110 ohms.
#stealthchop_threshold: 0
#   The velocity (in mm/s) to set the "stealthChop" threshold to. When
#   set, "stealthChop" mode will be enabled if the stepper motor
#   velocity is below this value. Note that the "sensorless homing"
#   code may temporarily override this setting during homing
#   operations. The default is 0, which disables "stealthChop" mode.
#coolstep_threshold:
#   The velocity (in mm/s) to set the TMC driver internal "CoolStep"
#   threshold to. If set, the coolstep feature will be enabled when
#   the stepper motor velocity is near or above this value. Important
#   - if coolstep_threshold is set and "sensorless homing" is used,
#   then one must ensure that the homing speed is above the coolstep
#   threshold! The default is to not enable the coolstep feature.
#high_velocity_threshold:
#   The velocity (in mm/s) to set the TMC driver internal "high
#   velocity" threshold (THIGH) to. This is typically used to disable
#   the "CoolStep" feature at high speeds. The default is to not set a
#   TMC "high velocity" threshold.
#driver_MSLUT0: 2863314260
#driver_MSLUT1: 1251300522
#driver_MSLUT2: 608774441
#driver_MSLUT3: 269500962
#driver_MSLUT4: 4227858431
#driver_MSLUT5: 3048961917
#driver_MSLUT6: 1227445590
#driver_MSLUT7: 4211234
#driver_W0: 2
#driver_W1: 1
#driver_W2: 1
#driver_W3: 1
#driver_X1: 128
#driver_X2: 255
#driver_X3: 255
#driver_START_SIN: 0
#driver_START_SIN90: 247
#   These fields control the Microstep Table registers directly. The optimal
#   wave table is specific to each motor and might vary with current. An
#   optimal configuration will have minimal print artifacts caused by
#   non-linear stepper movement. The values specified above are the default
#   values used by the driver. The value must be specified as a decimal integer
#   (hex form is not supported). In order to compute the wave table fields,
#   see the tmc2130 "Calculation Sheet" from the Trinamic website.
#driver_IHOLDDELAY: 8
#driver_TPOWERDOWN: 0
#driver_TBL: 1
#driver_TOFF: 4
#driver_HEND: 7
#driver_HSTRT: 0
#driver_VHIGHFS: 0
#driver_VHIGHCHM: 0
#driver_PWM_AUTOSCALE: True
#driver_PWM_FREQ: 1
#driver_PWM_GRAD: 4
#driver_PWM_AMPL: 128
#driver_FREEWHEEL: 0
#driver_SGT: 0
#driver_SEMIN: 0
#driver_SEUP: 0
#driver_SEMAX: 0
#driver_SEDN: 0
#driver_SEIMIN: 0
#driver_SFILT: 0
#   Set the given register during the configuration of the TMC2130
#   chip. This may be used to set custom motor parameters. The
#   defaults for each parameter are next to the parameter name in the
#   above list.
#diag0_pin:
#diag1_pin:
#   The micro-controller pin attached to one of the DIAG lines of the
#   TMC2130 chip. Only a single diag pin should be specified. The pin
#   is "active low" and is thus normally prefaced with "^!". Setting
#   this creates a "tmc2130_stepper_x:virtual_endstop" virtual pin
#   which may be used as the stepper's endstop_pin. Doing this enables
#   "sensorless homing". (Be sure to also set driver_SGT to an
#   appropriate sensitivity value.) The default is to not enable
#   sensorless homing.


[display]
lcd_type: ssd1306
#   Set to either "ssd1306" or "sh1106" for the given display type.
#i2c_mcu:
#i2c_bus:
i2c_software_scl_pin: PB6
i2c_software_sda_pin: PB7
#i2c_speed:
#   Optional parameters available for displays connected via an i2c
#   bus. See the "common I2C settings" section for a description of
#   the above parameters.
#cs_pin:
#dc_pin:
#spi_speed:
#spi_bus:
#spi_software_sclk_pin:
#spi_software_mosi_pin:
#spi_software_miso_pin:
#   The pins connected to the lcd when in "4-wire" spi mode. See the
#   "common SPI settings" section for a description of the parameters
#   that start with "spi_". The default is to use i2c mode for the
#   display.
reset_pin: PD7
#   A reset pin may be specified on the display. If it is not
#   specified then the hardware must have a pull-up on the
#   corresponding lcd line.
#contrast:
#   The contrast to set. The value may range from 0 to 256 and the
#   default is 239.
#vcomh: 0
#   Set the Vcomh value on the display. This value is associated with
#   a "smearing" effect on some OLED displays. The value may range
#   from 0 to 63. Default is 0.
#invert: False
#   TRUE inverts the pixels on certain OLED displays.  The default is
#   False.
#x_offset: 0
#   Set the horizontal offset value on SH1106 displays. The default is
#   0.

encoder_pins: ^PD4, ^PE0
click_pin: ^!PD0
